name = "peptide-push-worker"
main = "src/index.js"
compatibility_date = "2026-08-01"

kv_namespaces = [
  { binding = "SUBSCRIPTIONS", id = "b06c608479da49ec8f1976cdaa2ff779" }
]

# First entry: 12:00 UTC = 8:00 AM Eastern Daylight Time (EDT, currently in effect Aug 2026).
# Second entry: 18:00 UTC = 2:00 PM EDT — reminds you about split-dose compounds' PM dose.
# When clocks fall back to Eastern Standard Time (EST) in November, both will
# fire an hour later local time — change "12"->"13" and "18"->"19" then if you
# want them to stay at 8:00 AM / 2:00 PM year-round.
[triggers]
crons = ["0 12 * * *", "0 18 * * *"]
