name = "peptide-push-worker"
main = "src/index.js"
compatibility_date = "2026-08-01"

kv_namespaces = [
  { binding = "SUBSCRIPTIONS", id = "b06c608479da49ec8f1976cdaa2ff779" }
]

# Runs every 5 minutes. The Worker itself decides whether anything is
# actually due right now by checking each compound's own configured time(s)
# against the current time — so this single frequent check gives fully
# dynamic, per-compound timing without ever needing to redeploy when you
# change a dose time in the app.
[triggers]
crons = ["*/5 * * * *"]
